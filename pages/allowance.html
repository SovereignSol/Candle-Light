<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Allowance</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="link" href="./rewards.html">← Back to Menu</a>
    <div class="spacer"></div>
    <span id="authStatus" class="muted"></span>
    <button id="btnSignOut" class="btn btn-ghost hidden">Sign out</button>
  </header>

  <main class="container">
    <section class="card">
      <h1>Allowance</h1>
      <p class="muted">Balances and ledger. Owners can award allowance with optional sticker and message.</p>

      <div class="kpi" id="balances"></div>

      <hr class="sep" />

      <h2>Award allowance (owner)</h2>

      <div class="grid-2">
        <div>
          <label class="label">Recipient</label>
          <select id="awUser" class="select"></select>
        </div>

        <div>
          <label class="label">Amount</label>
          <input id="awAmount" class="input" placeholder="5.00" inputmode="decimal" />
        </div>

        <div>
          <label class="label">Sticker (optional)</label>
          <select id="awSticker" class="select"></select>
        </div>

        <div>
          <label class="label">Reason</label>
          <input id="awReason" class="input" placeholder="Good job" />
        </div>
      </div>

      <label class="label">Message (optional)</label>
      <textarea id="awMessage" class="textarea" placeholder="Nice work today!"></textarea>

      <div class="row">
        <button id="btnAward" class="btn btn-primary">Award</button>
        <span class="muted small">If you get an RLS error, ensure your role is <code>owner</code> in <code>app_members</code>.</span>
      </div>

      <hr class="sep" />

      <h2>Ledger</h2>
      <div id="ledger" class="list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>

  <script>
    const Allowance = (() => {
      const el = (id) => document.getElementById(id);
      const STICKER_MANIFEST_URL = "../help/stickers_manifest.json";
      let stickerManifest = null;
      let ownerUserId = null;
      let memberUserId = null;

      async function refreshRoleUsers() {
        const { data, error } = await Supa.client
          .from("app_members")
          .select("user_id,role");

        if (error) {
          ownerUserId = null;
          memberUserId = null;
          return;
        }

        ownerUserId = (data || []).find((x) => x.role === "owner")?.user_id || null;
        memberUserId = (data || []).find((x) => x.role === "member")?.user_id || (data || []).find((x) => x.role !== "owner")?.user_id || null;
      }

      function displayNameForUser(uid) {
        if (!uid) return "Unknown";
        if (uid === ownerUserId) return "Daddy";
        if (uid === memberUserId) return "BabyGirl";
        return uid;
      }

      function prettyLabelFromPath(path) {
        const raw = (path || "").split("/").pop() || "Sticker";
        const noExt = raw.replace(/\.[^.]+$/, "");
        return noExt.replace(/[_-]+/g, " ").replace(/\b\w/g, (m) => m.toUpperCase());
      }

      async function loadStickerManifest() {
        if (stickerManifest) return stickerManifest;

        const res = await fetch(STICKER_MANIFEST_URL, { cache: "no-store" });
        if (!res.ok) throw new Error(`Sticker manifest missing (${res.status})`);

        const json = await res.json();
        const list = Array.isArray(json) ? json : Array.isArray(json?.stickers) ? json.stickers : [];

        stickerManifest = list
          .map((s, idx) => ({
            id: s.id || `repo-${idx}`,
            label: s.label || prettyLabelFromPath(s.imagePath || s.image_path || ""),
            imagePath: s.imagePath || s.image_path || "",
            active: s.active !== false,
            sortOrder: Number.isFinite(Number(s.sortOrder)) ? Number(s.sortOrder) : idx
          }))
          .filter((s) => !!s.imagePath);

        return stickerManifest;
      }

      async function syncManifestStickersToTable(manifest) {
        const { data: rows, error: readErr } = await Supa.client
          .from("stickers")
          .select("image_path")
          .not("image_path", "is", null);
        if (readErr) return { error: readErr };

        const existing = new Set((rows || []).map((r) => r.image_path).filter(Boolean));
        const missing = (manifest || []).filter((m) => !existing.has(m.imagePath));
        if (!missing.length) return { error: null };

        const payload = missing.map((m) => ({
          label: m.label || prettyLabelFromPath(m.imagePath),
          image_path: m.imagePath,
          is_active: m.active !== false,
          sort_order: Number.isFinite(Number(m.sortOrder)) ? Number(m.sortOrder) : 0
        }));

        const { error: insertErr } = await Supa.client.from("stickers").insert(payload);
        return { error: insertErr || null };
      }

      function loadLocalPreview() {
        const balances = el("balances");
        balances.innerHTML = `
          <div class="box">
            <div class="muted small">Member</div>
            <div class="small">BabyGirl</div>
            <div class="muted small" style="margin-top:10px;">Balance</div>
            <div class="value">$42.00</div>
          </div>
        `;

        el("ledger").innerHTML = `<div class="muted">Local UI mode: ledger preview only.</div>`;

        const userSel = el("awUser");
        userSel.innerHTML = `<option value="00000000-0000-0000-0000-000000000002">BabyGirl (member)</option>`;

        const stSel = el("awSticker");
        stSel.innerHTML = `<option value="">No sticker</option><option value="sample">Gold Star</option>`;
      }

      function fmt(n) {
        if (n === null || n === undefined) return "";
        const num = Number(n);
        if (!Number.isFinite(num)) return String(n);
        return num.toFixed(2);
      }

      async function loadBalances() {
        await refreshRoleUsers();
        if (!memberUserId) {
          const root = el("balances");
          root.innerHTML = `<div class="muted">Member (BabyGirl) not configured in app_members yet.</div>`;
          return;
        }

        const { data, error } = await Supa.client
          .from("allowance_balances")
          .select("*")
          .eq("user_id", memberUserId)
          .order("user_id", { ascending: true });

        if (error) return UI.toast(error.message);

        const root = el("balances");
        root.innerHTML = "";

        if (!data || !data.length) {
          root.innerHTML = `<div class="muted">No balances yet.</div>`;
          return;
        }

        for (const b of data) {
          const box = document.createElement("div");
          box.className = "box";
          box.innerHTML = `
            <div class="muted small">Member</div>
            <div class="small">BabyGirl</div>
            <div class="muted small" style="margin-top:10px;">Balance</div>
            <div class="value">$${fmt(b.balance)}</div>
          `;
          root.appendChild(box);
        }
      }

      async function loadLedger() {
        await refreshRoleUsers();

        const { data, error } = await Supa.client
          .from("allowance_ledger")
          .select("id,user_id,amount,reason,message,sticker_id,created_by,created_at")
          .order("created_at", { ascending: false })
          .limit(200);

        if (error) return UI.toast(error.message);

        const root = el("ledger");
        root.innerHTML = "";

        if (!data || !data.length) {
          root.innerHTML = `<div class="muted">No ledger entries yet.</div>`;
          return;
        }

        for (const it of data) {
          const row = document.createElement("div");
          row.className = "list-row";

          const left = document.createElement("div");
          left.className = "pr-left";

          const t = document.createElement("div");
          t.className = "pr-title";
          t.textContent = `${it.reason || "Ledger entry"} (${it.amount >= 0 ? "+" : ""}${fmt(it.amount)})`;

          const meta = document.createElement("div");
          meta.className = "muted small";
          meta.textContent = `user: ${displayNameForUser(it.user_id)} • by: ${displayNameForUser(it.created_by)} • ${new Date(it.created_at).toLocaleString()}`;

          const msg = document.createElement("div");
          msg.className = "muted small";
          msg.textContent = it.message ? `msg: ${it.message}` : "";

          left.appendChild(t);
          left.appendChild(meta);
          if (it.message) left.appendChild(msg);

          row.appendChild(left);
          root.appendChild(row);
        }
      }

      async function loadMembersIntoSelect() {
        await refreshRoleUsers();

        const sel = el("awUser");
        sel.innerHTML = "";

        if (!memberUserId) {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "BabyGirl (member) not found";
          sel.appendChild(opt);
          return;
        }

        const opt = document.createElement("option");
        opt.value = memberUserId;
        opt.textContent = "BabyGirl (member)";
        sel.appendChild(opt);
      }

      async function loadStickersIntoSelect() {
        const sel = el("awSticker");
        sel.innerHTML = "";

        const optNone = document.createElement("option");
        optNone.value = "";
        optNone.textContent = "No sticker";
        sel.appendChild(optNone);

        let manifest = [];
        try {
          manifest = await loadStickerManifest();
        } catch (e) {
          UI.toast(`Could not load sticker manifest: ${e.message}`);
          return;
        }

        const activeManifest = manifest.filter((m) => m.active !== false);
        if (!activeManifest.length) {
          UI.toast("Sticker manifest has no active entries.");
          return;
        }
        const { error: syncErr } = await syncManifestStickersToTable(activeManifest);
        if (syncErr) {
          UI.toast(`Could not sync manifest stickers: ${syncErr.message}`);
          return;
        }

        const sortByPath = new Map(activeManifest.map((m) => [m.imagePath, m.sortOrder]));
        const labelByPath = new Map(activeManifest.map((m) => [m.imagePath, m.label]));
        const manifestPaths = activeManifest.map((m) => m.imagePath);

        const { data, error } = await Supa.client
          .from("stickers")
          .select("id,label,is_active,sort_order,image_path")
          .in("image_path", manifestPaths)
          .eq("is_active", true)
          .order("sort_order", { ascending: true });

        if (error) return UI.toast(error.message);

        const rows = (data || []).slice().sort((a, b) => {
          const sa = Number.isFinite(Number(sortByPath.get(a.image_path))) ? Number(sortByPath.get(a.image_path)) : 9999;
          const sb = Number.isFinite(Number(sortByPath.get(b.image_path))) ? Number(sortByPath.get(b.image_path)) : 9999;
          return sa - sb;
        });

        for (const s of rows) {
          const opt = document.createElement("option");
          opt.value = s.id;
          const label = labelByPath.get(s.image_path) || s.label || prettyLabelFromPath(s.image_path);
          opt.textContent = `${label} [repo]`;
          sel.appendChild(opt);
        }
      }

      function toNumberOrNull(v) {
        const s = (v || "").trim();
        if (!s) return null;
        const n = Number(s);
        return Number.isFinite(n) ? n : null;
      }

      async function award() {
        const created_by = await Auth.getUserId();
        if (!created_by) return UI.toast("Not signed in.");

        const user_id = el("awUser").value;
        if (!user_id) return UI.toast("BabyGirl member user is not configured.");
        const amount = toNumberOrNull(el("awAmount").value);
        if (amount === null) return UI.toast("Amount must be a number.");

        const reason = (el("awReason").value || "").trim() || "Allowance";
        const message = (el("awMessage").value || "").trim() || null;
        const sticker_id = el("awSticker").value || null;

        const payload = { user_id, amount, reason, message, sticker_id, created_by };

        const { error } = await Supa.client
          .from("allowance_ledger")
          .insert(payload);

        if (error) return UI.toast(error.message);

        el("awAmount").value = "";
        el("awReason").value = "";
        el("awMessage").value = "";
        el("awSticker").value = "";
      }

      function subscribeRealtime() {
        const ch1 = Supa.client.channel("rt-allowance-ledger");
        ch1.on(
          "postgres_changes",
          { event: "*", schema: "public", table: "allowance_ledger" },
          async () => {
            await loadBalances();
            await loadLedger();
          }
        );
        ch1.subscribe();

        const ch2 = Supa.client.channel("rt-stickers-allowance");
        ch2.on(
          "postgres_changes",
          { event: "*", schema: "public", table: "stickers" },
          () => loadStickersIntoSelect()
        );
        ch2.subscribe();
      }

      function wire() {
        el("btnAward").addEventListener("click", async () => {
          if (Auth.isBypassed && Auth.isBypassed()) {
            UI.toast("Local UI mode: award disabled.");
            return;
          }
          await award();
        });
      }

      return {
        wire,
        subscribeRealtime,
        loadBalances,
        loadLedger,
        loadMembersIntoSelect,
        loadStickersIntoSelect,
        loadLocalPreview
      };
    })();

    (async () => {
      const ok = await Auth.requireSessionOrRedirect();
      if (!ok) return;

      await Auth.initHeaderUI();

      Allowance.wire();

      if (Auth.isBypassed && Auth.isBypassed()) {
        Allowance.loadLocalPreview();
        return;
      }

      await Allowance.loadBalances();
      await Allowance.loadLedger();
      await Allowance.loadMembersIntoSelect();
      await Allowance.loadStickersIntoSelect();
      Allowance.subscribeRealtime();
    })();
  </script>
</body>
</html>
