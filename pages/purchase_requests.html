<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>Purchase Requests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .container {
      max-width: 1240px;
    }
    .flat-section {
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
    }
    .pr-hero {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: url("../images/purchase_bg.webp");
      background-size: 110% 100%;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 1200px;
    }
    .pr-hero-inner {
      border: 0;
      border-radius: 0;
      padding: 14px;
      background: transparent;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    }
    .pr-hero-inner .label,
    .pr-hero-inner .input,
    .pr-hero-inner .select,
    .pr-hero-inner .btn {
      font-family: "Patrick Hand", "Comic Sans MS", cursive;
      letter-spacing: 0.35px;
    }
    .pr-hero-inner .grid-2 > div {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pr-form-title {
      margin: 180px 0 8px;
      position: relative;
      top: -100px;
      text-align: center;
      color: #000000;
      font-family: "Patrick Hand", "Comic Sans MS", cursive;
      font-style: italic;
      transform: skewX(-4deg);
      font-size: 44px;
      line-height: 1;
      text-shadow: 0 1px 1px rgba(255,255,255,0.5);
    }
    .pr-hero-inner .grid-2 {
      margin-top: 68px;
    }
    .pr-hero-inner .label {
      font-size: 20px;
      color: #000000;
      margin-bottom: 8px;
      width: 50%;
      min-width: 180px;
    }
    .pr-hero-inner .input,
    .pr-hero-inner .select {
      border: 2px solid rgba(255,255,255,0.80);
      border-radius: 14px;
      background: rgba(255,255,255,0.18);
      color: #000000;
      font-size: 24px;
      line-height: 1.2;
      padding: 12px 14px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.22);
      width: 50%;
      min-width: 180px;
    }
    .pr-hero-inner .input::placeholder {
      color: rgba(0,0,0,0.72);
      font-style: italic;
    }
    .pr-hero-inner .btn {
      font-size: 26px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.2);
      color: #000000;
    }
    .pr-submit-row {
      justify-content: center;
    }
    .pr-balance {
      margin-top: 6px;
      text-align: center;
      font-family: "Patrick Hand", "Comic Sans MS", cursive;
      color: #000000;
      font-size: 24px;
      font-weight: 700;
    }
    .flat-list {
      gap: 10px;
      margin-top: 8px;
    }
    .flat-list .list-row {
      border: 0;
      border-radius: 14px;
      background: url("../images/purchase_bg_thin.webp") center / 100% 100% no-repeat;
      padding: 16px 18px;
      min-height: 125px;
    }
    .flat-list .pr-title,
    .flat-list .muted,
    .flat-list .link {
      color: #000000;
      font-weight: 700;
    }
    .flat-list .pr-actions {
      transform: translateX(-40px);
    }
    .flat-list .pr-actions .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #000000;
    }
    .flat-list .pr-actions .btn:disabled {
      color: #000000;
    }
    .flat-list .pr-actions .btn img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }
    .flat-list .pr-left {
      margin-left: 32px;
    }
    .lane-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 10px 0 6px;
    }
    .lane-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }
    .lane-btn.active {
      border-color: rgba(79,140,255,0.55);
      background: rgba(79,140,255,0.18);
    }
    .lane-btn img {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }
    .lane-count {
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="link" href="./rewards.html">← Back to Menu</a>
    <div class="spacer"></div>
    <span id="authStatus" class="muted"></span>
    <button id="btnSignOut" class="btn btn-ghost hidden">Sign out</button>
  </header>

  <main class="container">
    <section class="flat-section">
      <div class="pr-hero">
        <div class="pr-hero-inner">
          <h1 class="pr-form-title">Purchase Requests</h1>
          <div class="grid-2">
            <div>
              <label class="label">Title</label>
              <input id="prTitle" class="input" placeholder="What do you want?" />
            </div>
            <div>
              <label class="label">Link</label>
              <input id="prLink" class="input" placeholder="https://..." />
            </div>
            <div>
              <label class="label">Cost</label>
              <input id="prCost" class="input" placeholder="19.99" inputmode="decimal" />
            </div>
            <div>
              <label class="label">Shipping</label>
              <input id="prShip" class="input" placeholder="0.00" inputmode="decimal" />
            </div>
            <div>
              <label class="label">Sale Ends</label>
              <input id="prSaleEnd" class="input" type="date" />
            </div>
            <div>
              <label class="label">Want Scale (1-10)</label>
              <select id="prWant" class="select">
                <option value="">Select</option>
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
                <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
              </select>
            </div>
          </div>

          <div class="row pr-submit-row">
            <button id="btnSubmit" class="btn btn-primary">Submit</button>
          </div>
          <div id="prBalance" class="pr-balance">Current Allowance Balance: $0.00</div>
        </div>
      </div>

      <hr class="sep" />

      <div class="lane-tabs">
        <button class="lane-btn active" data-lane="pending"><img src="../icons/status_pending.webp" alt="">Pending Approval <span id="countPending" class="lane-count">(0)</span></button>
        <button class="lane-btn" data-lane="approved"><img src="../icons/status_approved.webp" alt="">Approved <span id="countApproved" class="lane-count">(0)</span></button>
        <button class="lane-btn" data-lane="denied"><img src="../icons/status_denied.webp" alt="">Denied <span id="countDenied" class="lane-count">(0)</span></button>
      </div>

      <div id="prList" class="list flat-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>

  <script>
    const PR = (() => {
      const el = (id) => document.getElementById(id);
      let allItems = [];
      let currentLane = "pending";
      let wishCoinUsedIds = new Set();
      let pleaseUsedThisMonthIds = new Set();
      let isOwner = false;
      let isMember = false;
      let memberUserId = null;
      let memberBalance = 0;

      async function getBalanceForUser(userId) {
        if (!userId) return 0;
        const { data, error } = await Supa.client
          .from("allowance_balances")
          .select("balance")
          .eq("user_id", userId)
          .maybeSingle();
        if (error) return 0;
        return Number(data?.balance || 0);
      }

      async function refreshRole() {
        const uid = await Auth.getUserId();
        if (!uid) {
          isOwner = false;
          isMember = false;
          return;
        }

        const { data, error } = await Supa.client
          .from("app_members")
          .select("role")
          .eq("user_id", uid)
          .maybeSingle();

        if (error) {
          isOwner = false;
          isMember = false;
          return;
        }
        const role = data?.role || "";
        isOwner = role === "owner";
        isMember = role !== "owner";
      }

      async function refreshMemberContext() {
        const { data, error } = await Supa.client
          .from("app_members")
          .select("user_id,role");

        if (error) {
          memberUserId = null;
          return;
        }

        const rows = data || [];
        memberUserId = rows.find((x) => x.role === "member")?.user_id || rows.find((x) => x.role !== "owner")?.user_id || null;
      }

      async function refreshWishCoinUsed() {
        const uid = (await Auth.getUserId()) || "guest";
        const key = `wishCoins:used:${uid}`;
        const pleaseKey = `please:usedMonth:${uid}`;
        const monthNow = (() => {
          const d = new Date();
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        })();

        try {
          const raw = localStorage.getItem(key);
          const parsed = raw ? JSON.parse(raw) : {};
          const ids = Object.keys(parsed || {}).filter((k) => !!parsed[k]);
          wishCoinUsedIds = new Set(ids);
        } catch {
          wishCoinUsedIds = new Set();
        }

        try {
          const rawPlease = localStorage.getItem(pleaseKey);
          const parsedPlease = rawPlease ? JSON.parse(rawPlease) : {};
          const idsPlease = Object.keys(parsedPlease || {}).filter((k) => parsedPlease[k] === monthNow);
          pleaseUsedThisMonthIds = new Set(idsPlease);
        } catch {
          pleaseUsedThisMonthIds = new Set();
        }
      }

      function laneOf(status) {
        if (status === "wishlist") return "wishlist";
        if (status === "approved") return "approved";
        if (status === "denied") return "denied";
        return "pending";
      }

      function updateCounts() {
        const pending = allItems.filter((x) => laneOf(x.status) === "pending").length;
        const approved = allItems.filter((x) => laneOf(x.status) === "approved").length;
        const denied = allItems.filter((x) => laneOf(x.status) === "denied").length;
        el("countPending").textContent = `(${pending})`;
        el("countApproved").textContent = `(${approved})`;
        el("countDenied").textContent = `(${denied})`;
      }

      function renderCurrentLane() {
        const items = allItems.filter((x) => laneOf(x.status) === currentLane);
        render(items);
      }

      function wireLaneTabs() {
        const btns = Array.from(document.querySelectorAll(".lane-btn"));
        btns.forEach((btn) => {
          btn.addEventListener("click", () => {
            btns.forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            currentLane = btn.getAttribute("data-lane") || "pending";
            renderCurrentLane();
          });
        });
      }

      function loadLocalPreview() {
        memberBalance = 42;
        allItems = [
          {
            id: "sample-pr-1",
            title: "Sample Purchase Item",
            status: "pending",
            cost: 19.99,
            shipping_cost: 3.99,
            sale_end_date: "2026-12-31",
            want_scale: 9,
            link: ""
          }
        ];
        updateCounts();
        renderCurrentLane();
      }

      function toNumberOrNull(v) {
        const s = (v || "").trim();
        if (!s) return null;
        const n = Number(s);
        return Number.isFinite(n) ? n : null;
      }

      function fmtMoney(n) {
        const num = Number(n);
        if (!Number.isFinite(num)) return "$0.00";
        return "$" + num.toFixed(2);
      }

      async function loadMemberBalance() {
        const elBal = el("prBalance");
        if (!elBal) return;

        if (Auth.isBypassed && Auth.isBypassed()) {
          elBal.textContent = "BabyGirl Allowance Balance: $42.00";
          return;
        }

        await refreshMemberContext();
        if (!memberUserId) {
          memberBalance = 0;
          elBal.textContent = "BabyGirl Allowance Balance: $0.00";
          return;
        }

        const { data, error } = await Supa.client
          .from("allowance_balances")
          .select("balance")
          .eq("user_id", memberUserId)
          .maybeSingle();

        if (error) {
          memberBalance = 0;
          elBal.textContent = "BabyGirl Allowance Balance: $0.00";
          return;
        }

        memberBalance = Number(data?.balance || 0);
        elBal.textContent = `BabyGirl Allowance Balance: ${fmtMoney(memberBalance)}`;
      }

      async function load() {
        await refreshWishCoinUsed();
        await refreshRole();
        await refreshMemberContext();

        const { data, error } = await Supa.client
          .from("purchase_requests")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) return UI.toast(error.message);
        allItems = data || [];
        updateCounts();
        renderCurrentLane();
      }

      function render(items) {
        const root = el("prList");
        root.innerHTML = "";

        if (!items.length) {
          root.innerHTML = `<div class="muted">No requests in this tab.</div>`;
          return;
        }

        for (const it of items) {
          const row = document.createElement("div");
          row.className = "list-row";

          const left = document.createElement("div");
          left.className = "pr-left";

          const title = document.createElement("div");
          title.className = "pr-title";
          title.textContent = it.title;

          const meta = document.createElement("div");
          meta.className = "muted small";
          const cost = it.cost ?? "";
          const ship = it.shipping_cost ?? "";
          const sale = it.sale_end_date || "-";
          const want = Number.isInteger(it.want_scale) ? it.want_scale : "-";
          const isPending = laneOf(it.status) === "pending";
          const coinTag = isPending && wishCoinUsedIds.has(it.id) ? " • Wish Coin Used" : "";
          const pleaseTag = isPending && pleaseUsedThisMonthIds.has(it.id) ? " • Please Used" : "";
          meta.textContent = `Status: ${it.status} • Cost: ${cost}${ship !== "" ? " • Shipping: " + ship : ""} • Sale Ends: ${sale} • Want: ${want}${pleaseTag}${coinTag}`;

          const link = document.createElement("a");
          link.className = "link small";
          link.href = it.link || "#";
          link.textContent = it.link ? "Open link" : "";
          link.target = "_blank";
          link.rel = "noreferrer";
          if (!it.link) link.style.display = "none";

          left.appendChild(title);
          left.appendChild(meta);
          left.appendChild(link);

          const right = document.createElement("div");
          right.className = "pr-actions";

          const btnWishlist = document.createElement("button");
          btnWishlist.className = "btn btn-ghost";
          btnWishlist.innerHTML = `<img src="../icons/btn_wishlist.webp" alt="">Wishlist`;
          btnWishlist.onclick = () => setStatus(it.id, "wishlist", it);

          const btnApprove = document.createElement("button");
          btnApprove.className = "btn btn-primary";
          btnApprove.innerHTML = `<img src="../icons/btn_approve.webp" alt="">Approve`;
          btnApprove.onclick = () => setStatus(it.id, "approved", it);

          const btnDeny = document.createElement("button");
          btnDeny.className = "btn btn-danger";
          btnDeny.innerHTML = `<img src="../icons/btn_deny.webp" alt="">Deny`;
          btnDeny.onclick = () => setStatus(it.id, "denied", it);

          if (!(isMember && laneOf(it.status) === "denied")) {
            btnWishlist.disabled = true;
            btnWishlist.title = "Member can move denied -> wishlist";
          }

          if (!isOwner) {
            btnApprove.disabled = true;
            btnDeny.disabled = true;
            btnApprove.title = "Owner only";
            btnDeny.title = "Owner only";
          }

          right.appendChild(btnWishlist);
          right.appendChild(btnApprove);
          right.appendChild(btnDeny);

          row.appendChild(left);
          row.appendChild(right);
          root.appendChild(row);
        }
      }

      async function setStatus(id, status, it = null) {
        const prevStatus = it?.status || null;

        if (status === "wishlist") {
          if (!(isMember && prevStatus === "denied")) {
            UI.toast("Only the member can move denied items to wishlist.");
            return;
          }
        }

        if (status === "approved" || status === "denied") {
          if (!isOwner) {
            UI.toast("Only owner can approve or deny requests.");
            return;
          }

          if (status === "approved") {
            const requestOwnerBalance = await getBalanceForUser(it?.created_by);
            const totalCost = Number(it?.cost || 0) + Number(it?.shipping_cost || 0);
            if (totalCost > requestOwnerBalance) {
              UI.toast("Not enough BabyGirl allowance balance to approve this purchase.");
              return;
            }
          }
        }

        const { error } = await Supa.client
          .from("purchase_requests")
          .update({ status })
          .eq("id", id);

        if (error) {
          const msg = String(error.message || "");
          if (msg.toLowerCase().includes("allowance_ledger") && msg.toLowerCase().includes("row-level security")) {
            UI.toast("Approval requires an owner account with allowance_ledger insert permissions.");
          } else if (msg.toLowerCase().includes("insufficient member allowance balance")) {
            UI.toast("Not enough BabyGirl allowance balance to approve this purchase.");
          } else {
            UI.toast(error.message);
          }
        }
        else await load();
      }

      async function submit() {
        if (!isMember) return UI.toast("Only member can submit purchase requests.");

        const title = (el("prTitle").value || "").trim();
        const link = (el("prLink").value || "").trim();
        const cost = toNumberOrNull(el("prCost").value);
        const shipping_cost = toNumberOrNull(el("prShip").value);
        const sale_end_date = (el("prSaleEnd").value || "").trim();
        const want_scale = Number((el("prWant").value || "").trim());

        if (!title) return UI.toast("Title is required.");
        if (!link) return UI.toast("Link is required.");
        if (cost === null) return UI.toast("Cost is required.");
        if (shipping_cost === null) return UI.toast("Shipping is required.");
        if (!sale_end_date) return UI.toast("Sale Ends is required.");
        if (!Number.isInteger(want_scale) || want_scale < 1 || want_scale > 10) {
          return UI.toast("Want Scale (1-10) is required.");
        }

        const userId = await Auth.getUserId();
        if (!userId) return UI.toast("Not signed in.");

        const payload = {
          title,
          link,
          cost,
          shipping_cost,
          sale_end_date,
          want_scale,
          status: "pending",
          created_by: userId
        };

        const { error } = await Supa.client
          .from("purchase_requests")
          .insert(payload);

        if (error) return UI.toast(error.message);

        el("prTitle").value = "";
        el("prLink").value = "";
        el("prCost").value = "";
        el("prShip").value = "";
        el("prSaleEnd").value = "";
        el("prWant").value = "";
      }

      function wire() {
        wireLaneTabs();
        el("btnSubmit").addEventListener("click", async () => {
          if (Auth.isBypassed && Auth.isBypassed()) {
            UI.toast("Local UI mode: submit disabled.");
            return;
          }
          await submit();
        });
      }

      function subscribeRealtime() {
        const channel = Supa.client.channel("rt-pr");
        channel.on(
          "postgres_changes",
          { event: "*", schema: "public", table: "purchase_requests" },
          () => load()
        );
        channel.subscribe();

        const balChannel = Supa.client.channel("rt-pr-balance");
        balChannel.on(
          "postgres_changes",
          { event: "*", schema: "public", table: "allowance_balances" },
          () => loadMemberBalance()
        );
        balChannel.on(
          "postgres_changes",
          { event: "*", schema: "public", table: "allowance_ledger" },
          () => loadMemberBalance()
        );
        balChannel.subscribe();
      }

      return { load, wire, subscribeRealtime, loadLocalPreview, loadMemberBalance };
    })();

    (async () => {
      const ok = await Auth.requireSessionOrRedirect();
      if (!ok) return;

      await Auth.initHeaderUI();
      PR.wire();

      if (Auth.isBypassed && Auth.isBypassed()) {
        PR.loadLocalPreview();
        await PR.loadMemberBalance();
        return;
      }

      await PR.load();
      await PR.loadMemberBalance();
      PR.subscribeRealtime();
    })();
  </script>
</body>
</html>
