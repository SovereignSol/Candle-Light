<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>Rewards Menu</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 8px;
    }
    .menu-btn {
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 10px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: linear-gradient(180deg, rgba(10,16,28,0.98), rgba(7,12,22,0.98));
      color: var(--text);
      text-decoration: none;
      min-height: 320px;
      overflow: hidden;
    }
    .menu-btn:hover {
      border-color: rgba(79,140,255,0.55);
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    }
    .menu-media {
      position: relative;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #0c1323;
      min-height: 240px;
      overflow: hidden;
    }
    .menu-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .menu-chip {
      position: absolute;
      left: 10px;
      bottom: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.30);
      background: rgba(14,22,36,0.72);
      color: #dce7f8;
      font-size: 11px;
      font-weight: 700;
    }
    .menu-text {
      padding: 2px 6px 6px;
    }
    .menu-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
    }
    .menu-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }
    @media (max-width: 900px) {
      .menu-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="link" href="../index.html">← Home</a>
    <div class="spacer"></div>
    <span id="authStatus" class="muted"></span>
    <button id="btnSignOut" class="btn btn-ghost hidden">Sign out</button>
  </header>

  <main class="container">
    <section class="card">
      <h1 style="margin-top:0;">Main Menu</h1>
      <p class="muted">Choose an area.</p>

      <div class="menu-grid">
        <a class="menu-btn" href="./purchase_requests.html">
          <div class="menu-media">
            <img src="../icons/tab_purchase.webp" alt="Purchase Requests">
            <span class="menu-chip">Tap to open</span>
          </div>
          <div class="menu-text">
            <div class="menu-title">Purchase Requests</div>
            <div class="menu-sub">Submit, review, and track requests</div>
          </div>
        </a>

        <a class="menu-btn" href="./allowance.html">
          <div class="menu-media">
            <img src="../icons/tab_allowance.webp" alt="Allowance">
            <span class="menu-chip">Balances</span>
          </div>
          <div class="menu-text">
            <div class="menu-title">Allowance</div>
            <div class="menu-sub">Balances, awards, and ledger</div>
          </div>
        </a>

        <a class="menu-btn" href="./stickers.html">
          <div class="menu-media">
            <img src="../icons/tab_stickerbook.webp" alt="Sticker Book">
            <span class="menu-chip">Collect</span>
          </div>
          <div class="menu-text">
            <div class="menu-title">Sticker Book</div>
            <div class="menu-sub">Manage and view sticker options</div>
          </div>
        </a>

        <a class="menu-btn" href="./wishlist.html">
          <div class="menu-media">
            <img src="../icons/tab_wishlist.webp" alt="Wishlist">
            <span class="menu-chip">Wishes</span>
          </div>
          <div class="menu-text">
            <div class="menu-title">Wishlist</div>
            <div class="menu-sub">View denied items saved for later</div>
          </div>
        </a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    (async () => {
      await Auth.initHeaderUI();
    })();
  </script>
</body>
</html>
